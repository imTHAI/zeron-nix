name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # onnxruntime (built from the PR source, not cached) plus the zeron LTO
    # build take well over the default hour on a 4-core runner.
    timeout-minutes: 360
    steps:
      - name: Free disk space
        # The runner image ships ~30 GB of SDKs we never use; onnxruntime and
        # the cargo target dir need most of that back.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        run: nix build .#zeron -L

      - name: Smoke test
        run: |
          ./result/bin/zeron --version
          ls -R result/share
